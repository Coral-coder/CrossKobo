name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          Publish a release with this tag (for example v0.1.0). Leave empty to
          build and keep the packages as run artifacts only.
        required: false
        default: ""

jobs:
  host:
    name: host build, tests and screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ ninja-build

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Render every screen
        run: ./build/crosskobo-sim --root out/sim-root --out out/sim

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: out/sim

  sanitizers:
    name: tests under AddressSanitizer and UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ ninja-build

      - name: Configure
        run: |
          cmake -S . -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build-asan -j"$(nproc)"

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-asan --output-on-failure

      - name: Render every screen
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ./build-asan/crosskobo-sim --root out/asan-root --out out/asan

  device:
    name: device build and packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++-arm-linux-gnueabihf qemu-user-static zip unzip shellcheck

      - name: Check the installer scripts
        run: |
          for f in scripts/install/*.sh scripts/install/crosskobo.init scripts/package.sh; do
            sh -n "$f"
          done
          shellcheck -s sh -S warning scripts/install/*.sh scripts/install/crosskobo.init \
            scripts/package.sh tests/test_package.sh

      - name: Configure
        run: |
          cmake -S . -B build-arm -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/kobo-armhf.cmake \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-arm -j"$(nproc)"

      - name: Check the binary is a static ARM executable
        run: |
          file build-arm/crosskobo
          file build-arm/crosskobo | grep -q "ARM"
          file build-arm/crosskobo | grep -q "statically linked"

      - name: Run the device binary under emulation
        run: |
          qemu-arm-static ./build-arm/crosskobo --version
          qemu-arm-static ./build-arm/crosskobo-sim --root out/arm-root --out out/arm

      - name: Package
        run: scripts/package.sh

      - name: Check the packages
        run: tests/test_package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: crosskobo-packages
          path: |
            release/*.zip
            release/KoboRoot.tgz

      - name: Publish a release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: CrossKobo ${{ inputs.release_tag || github.ref_name }}
          files: |
            release/*.zip
            release/KoboRoot.tgz
          body: |
            CrossKobo ${{ inputs.release_tag || github.ref_name }}

            Unpack a zip to the root of the Kobo's USB drive and eject; the
            device installs it and restarts by itself.

            **`CrossKobo-catalogues-*-install.zip`** - an add-on. The stock
            Kobo software stays in charge; this only adds OPDS catalogue
            browsing (Shelfmark, Calibre-Web, Kavita, Komga, BookLore,
            Gutenberg) to its menus, through NickelMenu. No boot takeover.

            **`CrossKobo-*-install.zip`** - the full interface, which starts
            instead of the stock Kobo home screen. Firmware 5.x devices use
            the `-fw5-install` package. Read `docs/INSTALL.md` first,
            including the recovery section: holding a page-turn button while
            the device starts boots the stock software, and both page
            buttons together open touch calibration.

            **Uninstall:** unpack the matching `-uninstall.zip` the same way.
